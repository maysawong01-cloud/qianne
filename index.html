<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>钱呢？</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="钱呢？">
<meta name="theme-color" content="#FFD84A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* Layout idea: a poster asking "钱呢？" in a yellow block, the total as its answer; the entry box straddles the block's edge; everything below is quiet paper. */
:root{
  --bg:#FFFDF5; --paper:#FFFFFF; --ink:#1B1A17; --ink2:#5A564C; --muted:#8C8676; --line:#EBE5D3;
  --hero:#FFD84A; --hero-ink:#1B1A17; --pop:#FF5B4A; --btn:#1B1A17; --btn-ink:#FFD84A; --bar:#DDD6C2; --sel:#1B1A17; --danger:#C93A2B;
  --s-food:#2a78d6; --s-transit:#eb6834; --s-shop:#1baf7a; --s-home:#eda100; --s-fun:#e87ba4; --s-health:#008300; --s-other:#6250d6; --s-market:#e34948;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161511; --paper:#201E19; --ink:#F6F1E2; --ink2:#C4BEAC; --muted:#8F8978; --line:#35312A;
    --hero:#F4CB35; --hero-ink:#1B1A17; --pop:#FF6F5F; --btn:#F4CB35; --btn-ink:#1B1A17; --bar:#48433A; --sel:#F4CB35; --danger:#F08476;
    --s-food:#3987e5; --s-transit:#d95926; --s-shop:#199e70; --s-home:#c98500; --s-fun:#d55181; --s-health:#008300; --s-other:#9085e9; --s-market:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161511; --paper:#201E19; --ink:#F6F1E2; --ink2:#C4BEAC; --muted:#8F8978; --line:#35312A;
  --hero:#F4CB35; --hero-ink:#1B1A17; --pop:#FF6F5F; --btn:#F4CB35; --btn-ink:#1B1A17; --bar:#48433A; --sel:#F4CB35; --danger:#F08476;
  --s-food:#3987e5; --s-transit:#d95926; --s-shop:#199e70; --s-home:#c98500; --s-fun:#d55181; --s-health:#008300; --s-other:#9085e9; --s-market:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.wrap{position:relative;max-width:460px;margin:0 auto;padding:0 16px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums;font-weight:600}

/* hero: yellow runs up under the status bar / Dynamic Island */
.wrap::before{content:"";position:absolute;left:0;right:0;top:-100vh;height:100vh;background:var(--hero)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:linear-gradient(#EFB81F,var(--hero));z-index:5}
.head{position:relative;margin:0 -16px;padding:calc(30px + env(safe-area-inset-top,0px)) 22px 62px;background:var(--hero);color:var(--hero-ink);border-radius:0 0 30px 30px;overflow:hidden}
.brand{margin:0;font:400 46px/1 var(--display);letter-spacing:.02em}
.brand b{font-weight:400;color:var(--pop);display:inline-block;transform:rotate(8deg) translateY(-2px);margin-left:1px}
.bill{position:absolute;right:18px;top:calc(26px + env(safe-area-inset-top,0px));width:132px;height:auto;overflow:visible}
.bill .paw{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.1s ease-in-out infinite alternate}
.bill .coins{animation:drift 2.4s ease-in infinite}
@keyframes wave{from{transform:rotate(-7deg)}to{transform:rotate(8deg)}}
@keyframes drift{0%{transform:translate(8px,8px);opacity:0}25%{opacity:1}100%{transform:translate(-6px,-10px);opacity:0}}
.say{position:relative;display:inline-block;margin:14px 0 0 2px;transform:rotate(-5deg);transform-origin:left center;background:#FFFDF5;border:2px solid #1B1A17;border-radius:14px 14px 4px 14px;padding:2px 12px 3px;font:400 15px/1.5 "ZCOOL KuaiLe",var(--sans);color:#E0392B;white-space:nowrap;transition:opacity .25s,transform .25s}
.say.out{opacity:0;transform:rotate(-5deg) translateY(8px) scale(.92)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(2deg)}}
.monthnav{display:flex;align-items:center;gap:2px;margin:10px 0 0 -10px;font-size:14px}
.monthnav button{background:none;border:0;width:36px;height:36px;border-radius:18px;font-size:20px;line-height:1;color:var(--hero-ink)}
.monthnav button:disabled{opacity:.25;cursor:default}
.monthnav .m{font-weight:700;min-width:84px;text-align:center}
.total{font:400 clamp(54px,19vw,84px)/.95 var(--display);letter-spacing:.01em;word-break:break-all;margin-top:6px}
.total small{font-size:.45em;margin-right:4px;vertical-align:.7em;opacity:.6}
.sub{font-size:14px;font-weight:600;margin-top:8px}
.mood{font-size:14px;opacity:.72}
.note{font-size:12px;opacity:.7;margin-top:4px}
.note.warn{opacity:1;font-weight:700}

/* entry box */
.entry{position:relative;margin-top:-58px;background:var(--paper);border:2px solid var(--hero-ink);border-radius:18px;box-shadow:4px 5px 0 var(--hero-ink);padding:8px;display:flex;flex-direction:column;gap:8px}
.entry form{display:flex;gap:8px}
.entry input{flex:1;min-width:0;border:0;background:none;font-size:18px;padding:10px 8px;outline:none}
.entry input::placeholder{color:var(--muted)}
.go{border:0;background:var(--btn);color:var(--btn-ink);font:400 21px/1 var(--display);letter-spacing:.06em;border-radius:12px;padding:0 18px;min-height:48px;transition:transform .08s}
.go:active{transform:translateY(2px)}
.go:disabled{opacity:.3;cursor:default}
.preview{display:flex;flex-direction:column;border-top:2px dotted var(--line);padding:2px 8px 0}
.preview:empty{display:none}
.hint{font-size:13px;color:var(--muted);padding:0 8px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 4px}
.chip{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:4px 12px;font-size:14px}
.fly{position:fixed;width:28px;z-index:30;pointer-events:none;animation:fly .9s cubic-bezier(.3,.1,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(60px,-260px) rotate(24deg) scale(1.1);opacity:0}}

/* tabs */
.tabs{display:flex;gap:22px;padding:6px 6px 0;border-bottom:2px solid var(--ink)}
.tabs a{padding:4px 2px 8px;text-decoration:none;color:var(--muted);font:400 22px/1.1 var(--display);letter-spacing:.04em;position:relative}
.tabs a[aria-current="true"]{color:var(--ink)}
.tabs a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;background:var(--hero);border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0}

/* rows */
#view{display:flex;flex-direction:column;gap:26px}
.card{padding:0 6px}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 0 4px;font-size:13px;color:var(--muted)}
.day:first-child{padding-top:0}
.day span:first-child{font-weight:700;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 0;text-align:left;min-height:46px}
.row + .row{border-top:1px solid var(--line)}
.dot{width:11px;height:11px;border-radius:4px;flex:none}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.row .c{font-size:12px;color:var(--muted);flex:none}
.row .a{flex:none;font-variant-numeric:tabular-nums;font-weight:600}
.row .d{font-size:12px;color:var(--muted);flex:none}
.empty{padding:26px 4px;color:var(--muted);font-size:15px;text-align:center}

.kid{display:inline-block;margin-left:7px;padding:0 7px;border-radius:999px;background:var(--hero);color:var(--hero-ink);font-size:11px;font-weight:700;line-height:18px;vertical-align:2px}
.kidot{background:var(--hero);border:2px solid var(--ink)}
.lg .cnt{color:var(--muted);font-size:13px;margin-left:6px;font-weight:400}
.sr .dot{width:8px;height:8px;border-radius:3px;align-self:center}
/* stats */
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font:800 19px/1.3 var(--sans)}
.sec h2 em{font:400 13px var(--sans);color:var(--muted);margin-left:8px;letter-spacing:0}
.stack{display:flex;gap:2px;height:22px}
.stack i{display:block;min-width:3px;border-radius:5px}
.legend{display:flex;flex-direction:column}
.lg{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:16px;width:100%;background:none;border:0;text-align:left;min-height:46px}
.lg:not(:first-child){border-top:1px solid var(--line)}
.lg .n{flex:1}
.lg .p{width:44px;text-align:right;color:var(--muted);font-size:13px;font-weight:400}
.lg .chev{color:var(--muted);width:10px;text-align:center;transition:transform .15s}
.lg[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lg[aria-expanded="true"] .n{font-weight:700}
.subs{display:flex;flex-direction:column;margin:0 0 12px 21px;padding:4px 14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px}
.sr{display:flex;align-items:baseline;gap:10px;padding:7px 0;font-size:14px;color:var(--ink2)}
.sr + .sr{border-top:1px dotted var(--line)}
.sr .n{flex:1;min-width:0;overflow-wrap:anywhere}
.sr small{color:var(--muted);margin-left:5px}
.sr .p{width:40px;text-align:right;color:var(--muted);font-size:12px;font-weight:400}
.trend{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:2px solid var(--ink)}
.trend button{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;background:none;border:0;padding:0}
.trend .v{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.trend .b{width:62%;max-width:36px;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px}
.trend [aria-pressed="true"] .b{background:var(--sel)}
.trend [aria-pressed="true"] .v{color:var(--ink);font-weight:700}
.tl{display:flex;gap:2px}
.tl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.tl .on{color:var(--ink);font-weight:700}
.link{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:10px;font-size:14px;width:100%}

.foot{display:flex;flex-direction:column;align-items:center;gap:0;padding:36px 0 0;font-size:11px;color:var(--muted);text-align:center;opacity:.75}
.foot-a{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px}
.foot button{background:none;border:0;padding:8px 2px;font-size:11px;color:var(--muted)}
.foot .due{color:var(--danger)}
.sheet p{margin:0;font-size:14px;color:var(--ink2)}
.sheet textarea{border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:10px 12px;font:13px/1.4 var(--sans);color:var(--ink);width:100%;min-height:84px;resize:vertical}
.wide{border:1.5px solid var(--ink);background:var(--hero);color:var(--hero-ink);border-radius:12px;min-height:48px;font-weight:700;font-size:16px}
#w-list .lg{font-size:15px;min-height:42px;padding:6px 0}
#w-list .lg .c{font-size:13px;color:var(--muted)}
#w-list .lg button{background:none;border:0;color:var(--danger);font-size:13px;padding:8px 4px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:460px;border:2px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h2{margin:0;font:400 24px/1.2 var(--display);letter-spacing:.04em}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.f input{border:1.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:17px;color:var(--ink);width:100%;min-width:0}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:50px;text-align:left}
.f input[type=date]::-webkit-date-and-time-value{text-align:left}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:15px;color:var(--ink)}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--hero);color:var(--hero-ink);font-weight:700}
.acts{display:flex;gap:8px}
.acts .del,.acts .x{border:1.5px solid var(--ink);background:none;border-radius:12px;padding:0 16px;min-height:48px}
.acts .del{color:var(--danger);border-color:var(--danger)}
.acts .go{flex:1}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1B1A17;color:#FFFDF5;border-radius:999px;padding:9px 10px 9px 18px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast-t{min-width:0}
.toast button{white-space:nowrap;flex:none;background:#FFD84A;color:#1B1A17;border:0;border-radius:999px;font-weight:700;padding:5px 12px}
@media (prefers-reduced-motion:reduce){.bill .paw,.bill .coins,.fly{animation:none}.say{transition:none}.fly{display:none}.lg .chev,.go{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1 class="brand">钱呢<b>？</b></h1>
    <svg class="bill" viewBox="0 0 160 172" aria-hidden="true" id="bill">
      <defs><clipPath id="hc"><ellipse cx="82" cy="58" rx="50" ry="38"/></clipPath><clipPath id="bc"><ellipse cx="82" cy="112" rx="57" ry="44"/></clipPath></defs>
      <g fill="#FFFDF5" stroke="#1B1A17" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
        <g class="coins"><circle cx="15" cy="60" r="8" fill="#FFD84A"/><circle cx="27" cy="32" r="6.500" fill="#FFD84A"/><circle cx="9" cy="90" r="5" fill="#FFD84A"/><path d="M15 56.500 v7 M27 29.500 v5" fill="none" stroke-width="2.2"/></g>

        <ellipse cx="82" cy="58" rx="50" ry="38" fill="none"/>
        <path d="M62 98 Q82 140 102 98 Z" fill="#FF5B4A"/>
        <g stroke="none" fill="#FFD84A"><circle cx="74" cy="108" r="2"/><circle cx="90" cy="108" r="2"/><circle cx="82" cy="119" r="2"/></g>
        <path d="M41 88 Q82 108 123 88" fill="none" stroke-width="13"/>
        <path d="M41 88 Q82 108 123 88" fill="none" stroke="#FF5B4A" stroke-width="7"/>
        <circle cx="82" cy="102" r="9.500" fill="#FFD84A" stroke-width="2.8"/>
        <path d="M74.500 102 h15" fill="none" stroke-width="2"/><circle cx="82" cy="106.500" r="1.700" fill="#1B1A17" stroke="none"/>
        <g fill="none" stroke-width="3.2"><path d="M55 58 Q63.500 47 72 58"/><path d="M92 58 Q100.500 47 109 58"/></g>
        <path d="M74 69 Q78 74.500 82 68.500 Q86 74.500 90 69" fill="none" stroke-width="2.6"/>
        <path d="M78.500 62 h7 l-3.500 4 Z" fill="#FF5B4A" stroke="#FF5B4A" stroke-width="1.6"/>

        <g transform="rotate(-16 54 124)"><rect x="24" y="106" width="60" height="36" rx="3" fill="#F0F3E2"/>

          <g stroke="none" fill="#2F7D57"><circle cx="54" cy="120.500" r="3.200"/><path d="M48 131.500 Q54 123.500 60 131.500 Q54 135 48 131.500 Z"/><circle cx="70.500" cy="118.500" r="3"/>
            <g font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="7.500" text-anchor="middle"><text x="33.500" y="119">1</text><text x="74.500" y="135">1</text><text x="74.500" y="119" opacity="0">1</text><text x="33.500" y="135">1</text></g></g></g>

      </g>
    </svg>
    <div class="say" id="saying" aria-hidden="true">去去就回</div>
    <div class="monthnav">
      <button id="prev" aria-label="上个月">‹</button>
      <span class="m" id="mlabel"></span>
      <button id="next" aria-label="下个月">›</button>
    </div>
    <div class="total" id="total"><small>$</small>—</div>
    <div class="sub" id="sub">正在翻账本…</div>
    <div class="mood" id="mood"></div>
    <div class="note" id="status" hidden></div>
  </header>

  <section class="entry" aria-label="记一笔">
    <form id="form" autocomplete="off">
      <input id="say" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="午饭 12，打车 23 昨天" aria-label="说或输入一笔支出">
      <button class="go" id="go" type="submit" disabled>花了</button>
    </form>
    <div class="preview" id="preview" aria-live="polite"></div>
    <div class="hint" id="hint"></div>
    <div class="chips" id="chips">
      <button class="chip" type="button">午饭 12</button>
      <button class="chip" type="button">打车 23 昨天</button>
      <button class="chip" type="button">coffee 4.5，买菜 36</button>
    </div>
  </section>

  <nav class="tabs" aria-label="视图">
    <a href="#list" id="tab-list">明细</a>
    <a href="#stats" id="tab-stats">去向</a>
  </nav>

  <main id="view"></main>
  <footer class="foot" id="foot" hidden>
    <div id="bk-age"></div>
    <div class="foot-a">

<script>
"use strict";
/* ---------- categories ---------- */
const CATS = [
  {id:"market",name:"超市", kw:["超市","stater bro","starter bro","staterbro","stater","斯泰特","买菜","grocer","trader joe","whole foods","safeway","costco","aldi","lidl","kroger","publix","wegmans","sprouts","h mart","hmart","99 ranch","ranch 99","meijer","food lion","giant","stop & shop","albertsons","ralphs","vons","h-e-b","heb","sam\'s club","instacart","奥迪","奥乐齐","阿尔迪","大华","好市多","开市客","全食","缺德舅","walmart","target","沃尔玛","塔吉特","菜市场","杂货","亚洲超市","华人超市","supermarket","market"]},
  {id:"food",   name:"餐饮", kw:["餐饮","早饭","早餐","午饭","午餐","晚饭","晚餐","夜宵","宵夜","吃饭","饭","外卖","奶茶","咖啡","零食","水果","菜","饮料","面包","火锅","烧烤","披萨","汉堡","寿司","面","breakfast","lunch","dinner","brunch","coffee","starbucks","latte","boba","tea","snack","restaurant","doordash","ubereats","uber eats","pizza","burger","sushi","food","meal","chipotle","mcdonald","sam's club"]},
  {id:"transit",name:"交通", kw:["交通","打车","的士","出租","地铁","公交","巴士","火车","高铁","机票","飞机","加油","油费","停车","过路","uber","lyft","taxi","subway","metro","bus","train","flight","gas","parking","toll","bart","caltrain"]},
  {id:"shop",   name:"购物", kw:["购物","衣服","裤子","鞋","包","淘宝","亚马逊","日用","化妆","护肤","洗发","纸巾","电器","手机壳","礼物","玩具","奶粉","尿布","纸尿裤","绘本","文具","toy","diaper","formula","amazon","clothes","shoes","shopping","gift","ikea","sephora"]},
  {id:"home",   name:"居住", kw:["居住","房租","租金","水电","电费","水费","燃气","煤气","网费","宽带","话费","物业","rent","utilit","electric","internet","wifi","phone bill","pg&e"]},
  {id:"fun",    name:"娱乐", kw:["娱乐","电影","游戏","演唱会","ktv","酒吧","旅游","门票","健身","会员","订阅","movie","netflix","spotify","game","concert","bar","gym","ticket","disney","youtube","subscription"]},
  {id:"health", name:"医疗", kw:["医疗","药","医院","看病","挂号","牙","体检","保险","doctor","pharmacy","cvs","walgreens","dentist","medicine","clinic","insurance","copay"]},
  {id:"other",  name:"其他", kw:[]}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const catColor = id => `var(--s-${CAT[id]?id:"other"})`;

/* ---------- parsing ---------- */
const CN_D={"零":0,"〇":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const CN_U={"十":10,"百":100,"千":1000};
function cnInt(s){
  if(s.length>1 && /^[零〇一二两三四五六七八九]+$/.test(s)) return +[...s].map(c=>CN_D[c]).join("");
  let total=0,sec=0,num=0,last=1;
  for(const c of s){
    if(c in CN_D) num=CN_D[c];
    else if(c==="万"){ total+=(sec+num||1)*10000; sec=0; num=0; last=10000; }
    else { sec+=(num||1)*CN_U[c]; num=0; last=CN_U[c]; }
  }
  const short = num && last>=100 && !/[零〇]/.test(s);
  return total+sec+(short? num*last/10 : num);
}
function cnNum(s){
  const [a,b]=s.split("点");
  let v=cnInt(a||"零");
  if(b) v+= +("0."+[...b].map(c=>CN_D[c]).join(""));
  return v;
}
const EN_W={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function enNum(s){
  let total=0,cur=0,dec=null;
  for(const w of s.toLowerCase().split(/[\s-]+/)){
    if(w==="point"){ dec=""; continue; }
    if(dec!==null){ if(EN_W[w]!==undefined && EN_W[w]<10) dec+=EN_W[w]; continue; }
    if(w==="hundred") cur=(cur||1)*100;
    else if(w==="thousand"){ total+=(cur||1)*1000; cur=0; }
    else if(EN_W[w]!==undefined) cur+=EN_W[w];
  }
  return total+cur+(dec? +("0."+dec):0);
}
const EN_ALT="(?:"+Object.keys(EN_W).join("|")+"|hundred|thousand|point)";
const RX_CN="[零〇一二两三四五六七八九十百千万]+(?:点[零〇一二三四五六七八九]+)?";
const AMT_SRC="([$＄¥￥]\\s*)?(?:(\\d+(?:\\.\\d+)?)|("+RX_CN+")|(\\b"+EN_ALT+"(?:[\\s-]+"+EN_ALT+")*\\b))"+
  "(?:\\s*(块钱|块|元)(?:([\\d一二两三四五六七八九半])(?:毛|角)?(?=$|[\\s，,。；;]))?|\\s*(刀|美金|美元|美刀|dollars?|bucks?|usd)|\\s*(毛|角))?";
function findAmount(seg){
  const rx=new RegExp(AMT_SRC,"gi"); let m,best=null;
  while((m=rx.exec(seg))){
    if(!m[0]){ rx.lastIndex++; continue; }
    let v = m[2]!==undefined ? +m[2] : m[3]!==undefined ? cnNum(m[3]) : enNum(m[4]);
    if(m[8]) v/=10;
    if(m[6]) v += m[6]==="半" ? .5 : (CN_D[m[6]]!==undefined?CN_D[m[6]]:+m[6])/10;
    const cents=Math.round(v*100);
    if(!(cents>0) || cents>1e9) continue;
    const score=(m[1]||m[5]||m[7]||m[8])?2:(m[2]!==undefined?1:0);
    if(!best || score>=best.score) best={cents,score,index:m.index,len:m[0].length};
  }
  return best;
}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ymOf=s=>s.slice(0,7);
function shift(d,days){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+days); return x; }
function takeDate(seg,today){
  const N="(\\d{1,2}|[一二两三四五六七八九十]{1,3})";
  const n=s=>/^\d/.test(s)?+s:cnInt(s);
  const rel=[[/大前天/,-3],[/前天|前日/,-2],[/昨天|昨日|昨晚|\byesterday\b/i,-1],[/今天|今日|今早|今晚|\btoday\b/i,0]];
  for(const [rx,off] of rel){ if(rx.test(seg)) return {seg:seg.replace(rx," "),date:ymd(shift(today,off))}; }
  let m=seg.match(new RegExp(N+"月"+N+"[号日]?")) || seg.match(/(\d{1,2})\/(\d{1,2})(?![\d.])/);
  if(m){
    const mo=n(m[1]),da=n(m[2]);
    if(mo>=1&&mo<=12&&da>=1&&da<=31){
      let d=new Date(today.getFullYear(),mo-1,da);
      if(d>shift(today,1)) d=new Date(today.getFullYear()-1,mo-1,da);
      return {seg:seg.replace(m[0]," "),date:ymd(d)};
    }
  }
  m=seg.match(new RegExp(N+"[号日](?![线楼店门桌用常])"));
  if(m){
    const da=n(m[1]);
    if(da>=1&&da<=31){
      let d=new Date(today.getFullYear(),today.getMonth(),da);
      if(d>shift(today,1)) d=new Date(today.getFullYear(),today.getMonth()-1,da);
      return {seg:seg.replace(m[0]," "),date:ymd(d)};
    }
  }
  return {seg,date:null};
}
function cleanNote(s){
  return s.replace(/花了|用了|付了|花费|消费了?|块钱|[$＄¥￥€£]/g," ").replace(/\s+/g," ").replace(/^[\s，,。；;、:：.\-]+|[\s，,。；;、:：.\-]+$/g,"");
}
const KID_KW=["孩子","小孩","宝宝","娃","儿子","女儿","闺女","儿童","童装","童鞋","奶粉","尿布","纸尿裤","玩具","绘本","幼儿园","托儿","学费","兴趣班","补习","课外","夏令营","儿科","疫苗","kid","child","baby","son","daughter","toy","diaper","daycare","preschool","tuition","pediatric","nanny","babysit"];
const normKey=s=>s.toLowerCase().replace(/\s+/g," ").trim();
function guessCat(note,learned){
  const k=normKey(note);
  if(!k) return "other";
  if(learned){
    if(learned[k] && CAT[learned[k]]) return learned[k];
    let hit=""; for(const w in learned) if(w.length>=2 && w.length>hit.length && k.includes(w) && CAT[learned[w]]) hit=w;
    if(hit) return learned[hit];
  }
  for(const c of CATS) for(const w of c.kw){
    if(/^[a-z&' ]+$/.test(w) ? new RegExp("(^|[^a-z])"+w.replace(/[&]/g,"\\$&"),"i").test(k) : k.includes(w)) return c.id;
  }
  return "other";
}
function guessKid(note){
  const k=normKey(note); if(!k) return false;
  if(typeof S!=="undefined"){
    if(typeof S.learnedKid[k]==="boolean") return S.learnedKid[k];
    let hit=""; for(const w in S.learnedKid) if(w.length>=2 && w.length>hit.length && k.includes(w)) hit=w;
    if(hit) return S.learnedKid[hit];
  }
  return KID_KW.some(w=>/^[a-z]+$/.test(w) ? new RegExp("(^|[^a-z])"+w,"i").test(k) : k.includes(w));
}
function parseSeg(seg,today,learned){
  const d=takeDate(seg,today);
  const a=findAmount(d.seg);
  if(!a) return null;
  const note=cleanNote(d.seg.slice(0,a.index)+" "+d.seg.slice(a.index+a.len));
  return {a:a.cents,n:note,c:guessCat(note,learned),k:guessKid(note),d:d.date};
}
function parseInput(text,today,learned){
  today=today||new Date();
  text=text.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/．/g,".").replace(/(\d),(?=\d{3}(?!\d))/g,"$1");
  const parts=text.split(/([，,；;。\n]+|还有|以及|\band\b)/i);
  const out=[]; let buf="";
  for(let i=0;i<parts.length;i+=2){
    buf+=parts[i];
    const r=parseSeg(buf,today,learned);
    if(r){ out.push(r); buf=""; } else buf+=parts[i+1]||"";
  }
  let trailing=null;
  if(buf.trim() && out.length){
    const d=takeDate(buf,today); trailing=d.date;
    const rest=cleanNote(d.seg);
    if(rest){ const l=out[out.length-1]; l.n=(l.n+" "+rest).trim(); l.c=guessCat(l.n,learned); l.k=guessKid(l.n); }
  }
  let cur=null;
  for(const e of out){ if(e.d) cur=e.d; else e.d=cur; }
  for(const e of out) if(!e.d) e.d=trailing||ymd(today);
  return out;
}

/* ---------- state ---------- */
const S={months:{},learned:{},learnedKid:{},sel:ymOf(ymd(new Date())),ready:false,cloud:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=c=>(c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=c=>{ const v=c/100; return v>=10000?"$"+(v/1000).toFixed(0)+"k":v>=1000?"$"+(v/1000).toFixed(1)+"k":"$"+Math.round(v); };
const WD=["周日","周一","周二","周三","周四","周五","周六"];
function dayLabel(s){
  const [y,m,d]=s.split("-").map(Number), dt=new Date(y,m-1,d), t=ymd(new Date());
  const tag = s===t?"今天 · ":s===ymd(shift(new Date(),-1))?"昨天 · ":"";
  return tag+m+"月"+d+"日 "+WD[dt.getDay()];
}
const monthLabel=ym=>{ const [y,m]=ym.split("-"); return y+"年"+(+m)+"月"; };
function addMonths(ym,n){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
const itemsOf=ym=>Object.entries((S.months[ym]||{}).items||{}).map(([id,v])=>({id,...v}));
const sumOf=ym=>itemsOf(ym).reduce((s,e)=>s+(e.a||0),0);

/* ---------- storage: cloud db when available, this browser otherwise ---------- */
let db=null; const inflight={}, dirty={};
const LS="ledger-v1";
function localSave(){ try{ localStorage.setItem(LS,JSON.stringify({months:S.months,learned:S.learned,learnedKid:S.learnedKid})); }catch(e){} }
function setStatus(t,warn){ const el=$("status"); el.hidden=!t; el.textContent=t||""; el.className="note"+(warn?" warn":""); }
async function push(path,getData){
  if(!db){ localSave(); return; }
  if(inflight[path]){ dirty[path]=true; return; }
  inflight[path]=true;
  try{
    do{
      dirty[path]=false;
      const data=JSON.parse(JSON.stringify(getData()));
      try{ await db.doc(path).set(data); }
      catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); await db.doc(path).set(data); } else throw e; }
    }while(dirty[path]);
    if(S.cloud) setStatus("");
  }catch(e){
    setStatus(e&&e.code==="quota_exceeded"?"云端空间已满，这一笔没有存上。请删掉一些旧记录后再试。":"这一笔没能存到云端，请检查网络后再记一次。",true);
  }finally{ inflight[path]=false; }
}
const saveMonth=ym=>push("months/"+ym,()=>({items:(S.months[ym]||{}).items||{}}));
const saveLearned=()=>push("meta/learned",()=>({list:[...new Set([...Object.keys(S.learned),...Object.keys(S.learnedKid)])].slice(-400).map(n=>{ const o={n}; if(S.learned[n]) o.c=S.learned[n]; if(typeof S.learnedKid[n]==="boolean") o.k=S.learnedKid[n]; return o; })}));

async function initStore(){
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db){
    try{ const j=JSON.parse(localStorage.getItem(LS)||"{}"); S.months=j.months||{}; S.learned=j.learned||{}; S.learnedKid=j.learnedKid||{}; }catch(e){}
    S.ready=true; setStatus(window.claude?"未连接云端：记录暂存在这台设备的浏览器里。":""); renderAll(); return;
  }
  const timer=setTimeout(()=>{ if(!S.ready){ setStatus("暂时连不上云端，记录可能不是最新的。",true); } },10000);
  const fail=()=>{ clearTimeout(timer); S.ready=true; setStatus("云端连接中断，请重新打开页面。",true); renderAll(); };
  db.collection("months").onSnapshot(snap=>{
    for(const doc of snap.docs){
      if(inflight["months/"+doc.id]) continue;
      const data=doc.data()||{};
      S.months[doc.id]={items:JSON.parse(JSON.stringify(data.items||{}))};
    }
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(!S.cloud){ S.cloud=true; setStatus(""); } }
    S.ready=true; renderAll();
  },fail);
  db.doc("meta/learned").onSnapshot(snap=>{
    if(inflight["meta/learned"]||!snap.exists) return;
    const m={},mk={}; for(const p of (snap.data().list||[])) if(p&&p.n){ if(p.c) m[p.n]=p.c; if(typeof p.k==="boolean") mk[p.n]=p.k; }
    S.learned=m; S.learnedKid=mk; renderPreview();
  },()=>{});
}

/* ---------- mutations ---------- */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function putItem(id,e){
  const ym=ymOf(e.d);
  (S.months[ym]||(S.months[ym]={items:{}})).items[id]={a:e.a,n:e.n,c:e.c,d:e.d,t:e.t||Date.now()};
  if(e.k) S.months[ym].items[id].k=1;
  return ym;
}
function dropItem(id){
  for(const ym in S.months){ const it=S.months[ym].items; if(it&&it[id]){ const old={...it[id]}; delete it[id]; return {ym,old}; } }
  return null;
}
function addEntries(list){
  const ids=[], touched=new Set();
  for(const e of list){ const id=newId(); ids.push(id); touched.add(putItem(id,e)); }
  touched.forEach(saveMonth);
  S.sel=ymOf(list[0].d);
  renderAll();
  const sum=list.reduce((s,e)=>s+e.a,0);
  flyBill();
  toast("又走了 $"+money(sum)+(list.length>1?"（"+list.length+" 笔）":""),()=>{
    const t=new Set(); ids.forEach(id=>{ const r=dropItem(id); if(r) t.add(r.ym); }); t.forEach(saveMonth); renderAll();
  });
}

/* ---------- render ---------- */
const MOOD_SPENT=["它们走得很安详。","没丢，只是换了个地方住。","花都花了。","至少你知道它去哪了。","钱是身外之物，它自己也这么觉得。","它们去了更需要它们的地方。"];
const MOOD_ZERO=["今天还没花。稳住。","今天钱包没有受伤。","今天到目前为止，一切安好。"];
const MOOD_PAST=["都过去了。","往事不必再提，账在这儿。"];
const pick=(a,n)=>a[(new Date().getDate()+n)%a.length];
const HINT="点输入框，再点键盘上的麦克风，直接坦白：“午饭十二块，打车二十三”。";
function flyBill(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const r=$("go").getBoundingClientRect(), el=document.createElement("div");
  el.innerHTML='<svg viewBox="0 0 28 28" width="28" height="28"><circle cx="14" cy="14" r="11.5" fill="#FFD84A" stroke="#1B1A17" stroke-width="3"/><path d="M14 8 v12" stroke="#1B1A17" stroke-width="2.6" stroke-linecap="round"/></svg>';
  el.className="fly"; el.style.left=(r.left+r.width/2-14)+"px"; el.style.top=(r.top-10)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),950);
}
function renderHead(){
  const now=ymOf(ymd(new Date()));
  $("mlabel").textContent=monthLabel(S.sel);
  $("next").disabled=S.sel>=now;
  if(!S.ready){ return; }
  const items=itemsOf(S.sel), total=items.reduce((s,e)=>s+e.a,0);
  $("total").innerHTML="<small>$</small>"+esc(money(total));
  if(S.sel===now){
    const t=ymd(new Date()), today=items.filter(e=>e.d===t).reduce((s,e)=>s+e.a,0);
    $("sub").textContent="今天 $"+money(today)+" · 本月 "+items.length+" 笔";
    $("mood").textContent=!items.length?"这个月一分没花？可疑。":!today?pick(MOOD_ZERO,items.length):pick(MOOD_SPENT,items.length);
  }else{ $("sub").textContent="共 "+items.length+" 笔"; $("mood").textContent=items.length?pick(MOOD_PAST,items.length):"这个月没有记录。清白的一个月。"; }
}
function rowHTML(e,withDate){
  const c=CAT[e.c]||CAT.other;
  return '<span class="dot" style="background:'+catColor(c.id)+'"></span><span class="t">'+esc(e.n||c.name)+(e.k?'<span class="kid">孩子</span>':'')+'</span>'+
    (e.n?'<span class="c">'+c.name+'</span>':'')+(withDate?'<span class="d">'+esc(withDate)+'</span>':'')+'<span class="a">$'+money(e.a)+'</span>';
}
function renderList(){
  const items=itemsOf(S.sel).sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:(y.t||0)-(x.t||0));
  if(!S.ready) return '<div class="card"><div class="empty">正在翻账本…</div></div>';
  if(!items.length) return '<div class="card"><div class="empty">'+monthLabel(S.sel)+'还没有记录。<br>钱还在，暂时。</div></div>';
  let h='<div class="card">', day=null;
  for(const e of items){
    if(e.d!==day){
      day=e.d; const ds=items.filter(x=>x.d===day).reduce((s,x)=>s+x.a,0);
      h+='<div class="day"><span>'+dayLabel(day)+'</span><span class="num">$'+money(ds)+'</span></div>';
    }
    h+='<button class="row" type="button" data-id="'+e.id+'" aria-label="修改 '+esc(e.n||"")+'">'+rowHTML(e)+'</button>';
  }
  return h+'</div>';
}
function renderStats(){
  const items=itemsOf(S.sel), total=items.reduce((s,e)=>s+e.a,0);
  const by={}; for(const e of items){ const k=CAT[e.c]?e.c:"other"; by[k]=(by[k]||0)+e.a; }
  const rows=CATS.filter(c=>by[c.id]).sort((a,b)=>by[b.id]-by[a.id]);
  let h='<div class="card"><div class="sec"><h2>钱去哪了<em>'+monthLabel(S.sel)+'</em></h2>';
  if(!rows.length) h+='<div class="empty">哪也没去。这个月还没有记录。</div>';
  else{
    h+='<div class="stack" role="img" aria-label="各分类占比">'+rows.map(c=>'<i style="flex:'+by[c.id]+' 1 0;background:'+catColor(c.id)+'"></i>').join("")+'</div><div class="legend">';
    for(const c of rows){
      const p=by[c.id]/total*100;
      const open=S.open===c.id;
      h+='<button class="lg" type="button" data-open="'+c.id+'" aria-expanded="'+open+'"><span class="dot" style="background:'+catColor(c.id)+'"></span><span class="n">'+c.name+'</span><span class="num">$'+money(by[c.id])+'</span><span class="p num">'+(p<1?"<1":Math.round(p))+'%</span><span class="chev" aria-hidden="true">›</span></button>';
      if(open){
        const g={};
        for(const e of items){ if((CAT[e.c]?e.c:"other")!==c.id) continue; const k=normKey(e.n||""); (g[k]||(g[k]={name:e.n||"（没写备注）",a:0,k:0})); g[k].a+=e.a; g[k].k++; }
        h+='<div class="subs">'+Object.values(g).sort((x,y)=>y.a-x.a).map(x=>{ const q=x.a/by[c.id]*100;
          return '<div class="sr"><span class="n">'+esc(x.name)+(x.k>1?'<small>'+x.k+' 笔</small>':'')+'</span><span class="num">$'+money(x.a)+'</span><span class="p num">'+(q<1?"<1":Math.round(q))+'%</span></div>'; }).join("")+'</div>';
      }
    }
    h+='</div>';
  }
  h+='</div></div>';
  const kids=items.filter(e=>e.k), ksum=kids.reduce((s,e)=>s+e.a,0);
  h+='<div class="card"><div class="sec"><h2>其中，花在孩子身上<em>已算在上面各类里，不重复</em></h2>';
  if(!kids.length) h+='<div class="empty">这个月没有孩子的开销。难得。</div>';
  else{
    const kopen=S.open==="kid", kp=ksum/total*100;
    h+='<div class="legend"><button class="lg" type="button" data-open="kid" aria-expanded="'+kopen+'"><span class="dot kidot"></span><span class="n">孩子<small class="cnt">'+kids.length+' 笔</small></span><span class="num">$'+money(ksum)+'</span><span class="p num">'+(kp<1?"<1":Math.round(kp))+'%</span><span class="chev" aria-hidden="true">›</span></button>';
    if(kopen){
      const g={};
      for(const e of kids){ const cid=CAT[e.c]?e.c:"other", k=cid+"|"+normKey(e.n||""); (g[k]||(g[k]={name:e.n||"（没写备注）",cid,a:0,k:0})); g[k].a+=e.a; g[k].k++; }
      h+='<div class="subs">'+Object.values(g).sort((x,y)=>y.a-x.a).map(x=>'<div class="sr"><span class="dot" style="background:'+catColor(x.cid)+'"></span><span class="n">'+esc(x.name)+'<small>'+CAT[x.cid].name+(x.k>1?' · '+x.k+' 笔':'')+'</small></span><span class="num">$'+money(x.a)+'</span></div>').join("")+'</div>';
    }
    h+='</div>';
  }
  h+='</div></div>';
  const now=ymOf(ymd(new Date()));
  let end=now; while(addMonths(end,-5)>S.sel) end=addMonths(end,-1);
  const ms=[]; for(let i=5;i>=0;i--) ms.push(addMonths(end,-i));
  const sums=ms.map(sumOf), max=Math.max(1,...sums);
  h+='<div class="card"><div class="sec"><h2>每个月走了多少</h2><div class="trend">'+ms.map((m,i)=>
    '<button type="button" data-month="'+m+'" aria-pressed="'+(m===S.sel)+'" aria-label="'+monthLabel(m)+' $'+money(sums[i])+'"><span class="v">'+(sums[i]?short(sums[i]):"")+'</span><span class="b" style="height:'+(sums[i]/max*78)+'%"></span></button>').join("")+
    '</div><div class="tl">'+ms.map(m=>'<span class="'+(m===S.sel?"on":"")+'">'+(+m.slice(5))+'月</span>').join("")+'</div></div></div>';
  return h;
}
function tab(){ return location.hash==="#stats"?"stats":"list"; }
function renderView(){
  const t=tab();
  $("tab-list").setAttribute("aria-current",t==="list");
  $("tab-stats").setAttribute("aria-current",t==="stats");
  $("view").innerHTML = t==="stats" ? renderStats() : renderList();
  $("foot").hidden = t!=="stats";
}
function renderPreview(){
  const list=parseInput($("say").value,new Date(),S.learned), today=ymd(new Date());
  $("go").disabled=!list.length;
  $("preview").innerHTML=list.map(e=>'<div class="row">'+rowHTML(e,e.d===today?"":dayLabel(e.d).replace(/ 周.$/,""))+'</div>').join("");
  const typing=$("say").value.trim().length>0;
  $("hint").hidden=typing && list.length>0;
  $("hint").textContent=typing&&!list.length?"多少钱？说个数就行，例如“午饭 12”。":HINT;
  const any=Object.values(S.months).some(m=>m.items&&Object.keys(m.items).length);
  $("chips").hidden=typing||any||!S.ready;
}
function renderAll(){ renderHead(); renderView(); renderPreview(); renderBackup(); }

/* ---------- toast ---------- */
let toastTimer=null, undoFn=null;
function toast(text,undo){
  $("toast-t").textContent=text; undoFn=undo||null; $("toast-u").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ $("toast").hidden=true; undoFn=null; },6000);
}
$("toast-u").onclick=()=>{ if(undoFn) undoFn(); undoFn=null; $("toast").hidden=true; };

/* ---------- edit sheet ---------- */
let editing=null;
function openEdit(id){
  const e=Object.values(S.months).map(m=>m.items&&m.items[id]).find(Boolean); if(!e) return;
  editing={id,cat:CAT[e.c]?e.c:"other",kid:!!e.k,orig:{...e}};
  $("e-kid").setAttribute("aria-pressed",editing.kid);
  $("e-amt").value=(e.a/100).toFixed(2); $("e-note").value=e.n||""; $("e-date").value=e.d;
  drawCats(); $("veil").hidden=false;
}
function drawCats(){
  $("e-cats").innerHTML=CATS.map(c=>'<button type="button" class="cat" data-cat="'+c.id+'" aria-pressed="'+(c.id===editing.cat)+'"><span class="dot" style="background:'+catColor(c.id)+'"></span>'+c.name+'</button>').join("");
}
const closeEdit=()=>{ $("veil").hidden=true; editing=null; };
$("e-cats").onclick=ev=>{ const b=ev.target.closest("[data-cat]"); if(b){ editing.cat=b.dataset.cat; drawCats(); } };
$("e-kid").onclick=()=>{ editing.kid=!editing.kid; $("e-kid").setAttribute("aria-pressed",editing.kid); };
$("e-x").onclick=closeEdit;
$("veil").onclick=ev=>{ if(ev.target===$("veil")) closeEdit(); };
$("e-save").onclick=()=>{
  const a=findAmount($("e-amt").value.trim());
  if(!a){ $("e-amt").focus(); toast("金额要填一个大于 0 的数字。"); return; }
  const d=/^\d{4}-\d{2}-\d{2}$/.test($("e-date").value)?$("e-date").value:editing.orig.d;
  const n=$("e-note").value.trim();
  const r=dropItem(editing.id), touched=new Set(r?[r.ym]:[]);
  touched.add(putItem(editing.id,{a:a.cents,n,c:editing.cat,k:editing.kid,d,t:editing.orig.t}));
  touched.forEach(saveMonth);
  let learn=false, note="";
  if(n && editing.cat!==guessCat(n,S.learned)){
    S.learned[normKey(n)]=editing.cat; learn=true;
    const k=applyWord(normKey(n),editing.cat,true);
    note="记住了：以后“"+n+"”都算"+CAT[editing.cat].name+"。"+(k?"之前的 "+k+" 笔也一起改了。":"");
  }
  if(n && editing.kid!==guessKid(n)){ S.learnedKid[normKey(n)]=editing.kid; learn=true; }
  if(learn) saveLearned();
  closeEdit(); renderAll();
  if(note) toast(note);
};
$("e-del").onclick=()=>{
  const id=editing.id, r=dropItem(id); closeEdit();
  if(!r) return; saveMonth(r.ym); renderAll();
  toast("记录删了，钱没回来。",()=>{ saveMonth(putItem(id,r.old)); renderAll(); });
};

/* ---------- events ---------- */
$("say").addEventListener("input",renderPreview);
$("form").addEventListener("submit",ev=>{
  ev.preventDefault();
  const list=parseInput($("say").value,new Date(),S.learned);
  if(!list.length) return;
  $("say").value=""; addEntries(list); $("say").focus();
});
$("chips").onclick=ev=>{ const b=ev.target.closest(".chip"); if(b){ $("say").value=b.textContent; renderPreview(); $("say").focus(); } };
$("prev").onclick=()=>{ S.sel=addMonths(S.sel,-1); renderAll(); };
$("next").onclick=()=>{ S.sel=addMonths(S.sel,1); renderAll(); };
$("view").onclick=ev=>{
  const row=ev.target.closest("[data-id]"); if(row) return openEdit(row.dataset.id);
  const ob=ev.target.closest("[data-open]"); if(ob){ S.open=S.open===ob.dataset.open?null:ob.dataset.open; renderView(); return; }
  const mb=ev.target.closest("[data-month]"); if(mb){ S.sel=mb.dataset.month; renderAll(); return; }
};
$("csv").onclick=()=>{
    const all=Object.keys(S.months).flatMap(itemsOf).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.t||0)-(y.t||0));
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const csv="日期,分类,备注,金额(USD),孩子\n"+all.map(e=>[e.d,(CAT[e.c]||CAT.other).name,q(e.n||""),(e.a/100).toFixed(2),e.k?"是":""].join(",")).join("\n");
    Promise.resolve().then(()=>navigator.clipboard.writeText(csv)).then(()=>toast("已复制 "+all.length+" 条记录。证据确凿。"),()=>toast("这个浏览器不允许复制，请换个浏览器再试。"));
  };

/* ---------- my words ---------- */
function applyWord(k,cat,exact){
  const touched=new Set(); let n=0;
  for(const ym in S.months) for(const e of Object.values(S.months[ym].items||{})){
    const key=normKey(e.n||"");
    if((exact?key===k:key.includes(k)) && e.c!==cat){ e.c=cat; n++; touched.add(ym); }
  }
  touched.forEach(saveMonth); return n;
}
let wCat="market";
function drawWords(){
  $("w-cats").innerHTML=CATS.map(c=>'<button type="button" class="cat" data-cat="'+c.id+'" aria-pressed="'+(c.id===wCat)+'"><span class="dot" style="background:'+catColor(c.id)+'"></span>'+c.name+'</button>').join("");
  const rows=Object.entries(S.learned).filter(([,c])=>CAT[c]).reverse();
  $("w-list").innerHTML=rows.length?rows.map(([w,c])=>'<div class="lg"><span class="dot" style="background:'+catColor(c)+'"></span><span class="n">'+esc(w)+'</span><span class="c">'+CAT[c].name+'</span><button type="button" data-del="'+esc(w)+'">删除</button></div>').join(""):'<div class="empty">词库还是空的。</div>';
}
$("w-open").onclick=()=>{ drawWords(); $("veil3").hidden=false; };
$("w-x").onclick=()=>{ $("veil3").hidden=true; };
$("veil3").onclick=ev=>{ if(ev.target===$("veil3")) $("veil3").hidden=true; };
$("w-cats").onclick=ev=>{ const b=ev.target.closest("[data-cat]"); if(b){ wCat=b.dataset.cat; drawWords(); } };
$("w-add").onclick=()=>{
  const k=normKey($("w-new").value);
  if(k.length<2){ $("w-new").focus(); toast("词至少要两个字。"); return; }
  S.learned[k]=wCat; saveLearned();
  const n=applyWord(k,wCat,false);
  $("w-new").value=""; drawWords(); renderAll();
  toast("记住了：“"+k+"”算"+CAT[wCat].name+"。"+(n?"之前的 "+n+" 笔也一起改了。":""));
};
$("w-list").onclick=ev=>{ const b=ev.target.closest("[data-del]"); if(!b) return; delete S.learned[b.dataset.del]; saveLearned(); drawWords(); renderPreview(); };

/* ---------- backup ---------- */
const BK="qianne-last-backup";
function renderBackup(){
  let t=null; try{ t=+localStorage.getItem(BK)||null; }catch(e){}
  const n=Object.keys(S.months).reduce((k,ym)=>k+itemsOf(ym).length,0), el=$("bk-age");
  const days=t?Math.floor((Date.now()-t)/864e5):null;
  el.textContent = !n ? "还没有记录，暂时不用备份。" : t===null ? "还没有备份过。" : days===0 ? "上次备份：今天。" : "上次备份："+days+" 天前。";
  el.className = n && (t===null || days>30) ? "due" : "";
}
function exportBackup(){
  const text=JSON.stringify({app:"qianne",v:1,exported:new Date().toISOString(),months:S.months,learned:S.learned,learnedKid:S.learnedKid});
  const name="钱呢-备份-"+ymd(new Date())+".txt";
  const done=msg=>{ try{ localStorage.setItem(BK,String(Date.now())); }catch(e){} renderBackup(); toast(msg); };
  const copy=()=>Promise.resolve().then(()=>navigator.clipboard.writeText(text)).then(()=>done("备份已复制。粘贴到备忘录里存好。"),()=>toast("没能导出，请换个浏览器再试。"));
  if(window.claude) return copy();
  try{
    const file=new File([text],name,{type:"text/plain"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(()=>done("备份已交出去，收好。"),e=>{ if(!e||e.name!=="AbortError") copy(); });
      return;
    }
  }catch(e){}
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"})); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); done("备份文件已下载。");
  }catch(e){ copy(); }
}
function importBackup(text){
  let j=null; try{ j=JSON.parse(text); }catch(e){}
  if(!j || typeof j.months!=="object" || !j.months){ toast("这不是“钱呢？”的备份。"); return false; }
  const have=new Set(Object.keys(S.months).flatMap(ym=>Object.keys(S.months[ym].items||{})));
  const touched=new Set(); let add=0, skip=0;
  for(const ym in j.months) for(const [id0,e] of Object.entries((j.months[ym]||{}).items||{})){
    if(!e || !(e.a>0) || !/^\d{4}-\d{2}-\d{2}$/.test(e.d||"")) continue;
    const id=/^[a-z0-9]+$/i.test(id0)?id0:newId();
    if(have.has(id)){ skip++; continue; }
    touched.add(putItem(id,{a:Math.round(e.a),n:String(e.n||""),c:CAT[e.c]?e.c:"other",k:!!e.k,d:e.d,t:+e.t||Date.now()})); have.add(id); add++;
  }
  let learn=false;
  for(const k in (j.learned||{})) if(!(k in S.learned) && CAT[j.learned[k]]){ S.learned[k]=j.learned[k]; learn=true; }
  for(const k in (j.learnedKid||{})) if(!(k in S.learnedKid) && typeof j.learnedKid[k]==="boolean"){ S.learnedKid[k]=j.learnedKid[k]; learn=true; }
  touched.forEach(saveMonth); if(learn) saveLearned();
  renderAll();
  toast(add ? "导入了 "+add+" 笔"+(skip?"，另有 "+skip+" 笔本来就在。":"。") : skip ? "这些记录本来就都在。" : "备份里没有记录。");
  return true;
}
const closeImp=()=>{ $("veil2").hidden=true; $("imp-text").value=""; };
$("bk-out").onclick=exportBackup;
$("bk-in").onclick=()=>{ $("veil2").hidden=false; };
$("imp-x").onclick=closeImp;
$("veil2").onclick=ev=>{ if(ev.target===$("veil2")) closeImp(); };
$("imp-pick").onclick=()=>$("bk-file").click();
$("bk-file").onchange=ev=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ if(importBackup(String(r.result||""))) closeImp(); }; r.onerror=()=>toast("这个文件读不出来。"); r.readAsText(f); ev.target.value="";
};
$("imp-go").onclick=()=>{ const t=$("imp-text").value.trim(); if(!t){ $("imp-text").focus(); return; } if(importBackup(t)) closeImp(); };
window.addEventListener("hashchange",renderView);
document.addEventListener("keydown",ev=>{ if(ev.key!=="Escape") return; if(!$("veil").hidden) closeEdit(); if(!$("veil2").hidden) closeImp(); });

const SAYINGS=["去去就回","江湖再见","你先动的手","我去帮你换快乐了","富贵在天"]; let sayI=0;
setInterval(()=>{
  const el=$("saying"); el.classList.add("out");
  setTimeout(()=>{ sayI=(sayI+1)%SAYINGS.length; el.textContent=SAYINGS[sayI]; el.classList.remove("out"); },260);
},4200);
renderAll();
initStore();
</script>
