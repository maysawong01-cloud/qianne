<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>钱呢？</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="钱呢？">
<meta name="theme-color" content="#F4EEE2">
<meta name="build" content="2026-11-15-3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a small receipt printer sits at the top of a desk; every spend prints a slip that drops into that day's cardboard box. Page two is the month's statement: 100 tiny slips, one per percent. Single light theme by choice. */
:root{
  --desk:#F3EADB; --paper:#FCF6EA; --ink:#2A2019; --ink2:#5F5247; --muted:#93877A; --line:#DAD5C8; --red:#CF3A28;
  --dev:#232326; --lcd:#BAC7A8; --lcd-ink:#1C2916; --kraft:#C7A26A; --kraft-in:#A9844F;
  --p-food:#FBDDC0; --p-market:#E2E6C6; --p-transit:#D6DEF0; --p-shop:#F5D3CD; --p-home:#FAE4BF; --p-fun:#DFD7F0; --p-health:#D2E8E1; --p-other:#E8E3DB;
  --s-food:#E0915A; --s-transit:#7C96C6; --s-shop:#DE8E86; --s-home:#E2A85C; --s-fun:#A08CCB; --s-health:#62AE9F; --s-other:#A39B8E; --s-market:#93AA63;
  --mono:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --sans:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --zb:conic-gradient(from -45deg at 50% 100%,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 5.5px round no-repeat;
  --zt:conic-gradient(from 135deg at 50% 0,#0000,#000 1deg 89deg,#0000 90deg) top/8px 5.5px round no-repeat;
  --zig:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/9px 100%;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.ic{width:1em;height:1em;display:block;object-fit:contain}

/* the printer */
.head{position:relative;z-index:3}
.dev{color:var(--ink)}
.dev-top{position:relative;aspect-ratio:1187/870;background:url(assets/printer-top.webp) 0 0/100% 100% no-repeat}
.dev-mid{background:url(assets/printer-mid.webp) 0 0/100% auto repeat-y;padding:0 7.5% 4px;margin:-1px 0;min-height:8px}
.dev-bot{position:relative;aspect-ratio:1187/226;background:url(assets/printer-bot.webp) 0 0/100% 100% no-repeat}
.bar{display:contents}
.brand{margin:0;position:absolute;left:14%;top:14.4%;transform:translateY(-50%);font:700 16px/1 var(--sans);letter-spacing:.3em;color:var(--ink)}
.brand i{display:none}
.rb{position:absolute;top:5.75%;width:12.64%;aspect-ratio:1;border-radius:50%;border:0;background:none;color:var(--ink);font:700 20px/1 var(--mono);display:grid;place-items:center;padding:0 0 3px}
#prev{left:66.55%}
#next{left:81.72%}
.rb:active{transform:translateY(1px)}
.rb:disabled{opacity:.3;cursor:default}
.lcd{position:absolute;left:6.6%;top:33.4%;width:86.8%;height:31.4%;color:var(--ink);padding:0 10px;font-family:var(--mono);display:flex;flex-direction:column;justify-content:center}
.lcd .l1,.lcd .l3{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.04em}
.total{font:700 27px/1.2 var(--mono);letter-spacing:.01em;word-break:break-all}
.total small{font-size:.7em;margin-right:2px;font-weight:500}
.sub{display:none}
.entry{display:flex;flex-direction:column;gap:8px}
.dev-top form{display:contents}
.dev-top input{position:absolute;left:6.6%;top:74.3%;width:58.6%;height:16.4%;min-width:0;border:0;background:none;color:var(--ink);border-radius:8px;font-size:17px;padding:0 8px;outline:none}
.dev-top input::placeholder{color:#A39A88}
#go{position:absolute;left:69.8%;top:72.3%;width:25.9%;height:20%;min-height:0;padding:0;background:none;box-shadow:none;color:#FFF7EA;font-size:17px;border-radius:12px}
#go:active{transform:translateY(1px)}
.go{border:0;background:var(--paper);color:var(--ink);font:700 16px/1 var(--sans);letter-spacing:.1em;border-radius:10px;padding:0 18px;min-height:48px;box-shadow:0 2px 0 #9b978b}
.go:active{transform:translateY(2px);box-shadow:none}
.go:disabled{opacity:.35;cursor:default}
.preview{display:flex;flex-direction:column}
.preview:empty{display:none}
.row{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;color:var(--ink)}
.row + .row{border-top:1px dashed #BDB29B}
.ico{flex:none;width:28px;height:28px;display:grid;place-items:center;font-size:26px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .c,.row .d{font-size:11px;color:var(--ink2);flex:none}
.row .a{flex:none;font:500 14px var(--mono)}
.hint{font-size:12px;color:var(--ink2);padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px}
.slot{position:absolute;left:0;right:0;top:27.9%;height:420px;overflow:hidden;pointer-events:none;z-index:2}
.stub{position:relative;z-index:1;width:62%;margin:-12.5% auto 0;border:solid transparent;border-width:0 5px 9px 3px;border-image:url(assets/slip.webp) 10 16 30 10 fill/0 5px 9px 3px round stretch;padding:12px 8px 6px;text-align:center;font:500 12px/1.4 var(--mono);color:var(--ink2)}
.say{display:block;transition:opacity .25s}
.say.out{opacity:0}
#mood{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:2px}
.slip.printing{position:absolute;left:19%;top:0;width:62%;min-height:190px;transform-origin:50% 0;animation:print 1.05s cubic-bezier(.3,.1,.3,1) forwards;pointer-events:none}
@keyframes print{0%{transform:translateY(-100%)}55%{transform:translateY(-3%);opacity:1}64%{transform:translateY(-3%);opacity:1}100%{transform:translateY(190px) scale(.5) rotate(9deg);opacity:0}}
.slip.printing{padding:9px 9px 16px}
.slip.printing .art{height:78px;font-size:60px}
.slip.printing .art .ic{width:58px;height:58px}
.slip.printing .ct{font-size:12px;padding:10px 5px 0}
.slip.printing .nm{font-size:19px;padding:3px 5px 0}
.slip.printing .am{font-size:22px;padding:9px 0 0;margin-inline:5px}
.slip.printing .bc{height:11px;margin:9px 5px 0}
.slip.printing .stk{width:40px;height:40px;top:8px;right:6px}
.stub{transition:opacity .12s}
.stub.away{opacity:0}
.note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.note.warn{color:var(--red);font-weight:700}

/* tabs: two paper index tabs */
.tabs{display:flex;justify-content:space-between;gap:6px;border-bottom:1.5px solid var(--ink);padding:0 6px}
.tabs a{padding:8px 16px 7px;border:1.5px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;text-decoration:none;color:var(--ink2);font:600 14px/1.2 var(--sans);letter-spacing:.08em;background:#D9D5CA;margin-bottom:-1.5px}
.tabs a[aria-current="true"]{background:var(--desk);color:var(--ink);border-bottom:1.5px solid var(--desk)}

/* day boxes */
#view{display:flex;flex-direction:column;gap:22px}
.box{position:relative}
.lab{position:relative;z-index:2;display:flex;align-items:baseline;gap:10px;width:max-content;max-width:92%;margin:0 0 -9px 12px;border:solid transparent;border-width:0 14px;border-image:url(assets/label.webp) 0 24 0 24 fill/0 14px stretch;padding:7px 4px;font:500 12px/1.3 var(--mono);transform:rotate(-1.2deg);filter:drop-shadow(1px 2px 1px rgba(60,35,5,.25))}
.lab b{font:700 13px var(--sans)}
.lab em{font-style:normal;font-weight:700}
.tray{position:relative;border:solid transparent;border-width:17px 16px 15px 15px;border-image:url(assets/box2.webp) 50 47 46 43/17px 16px 15px 15px round;background:#D9B58C padding-box;box-shadow:inset 0 9px 9px -7px rgba(70,40,5,.4),inset 9px 0 9px -7px rgba(70,40,5,.25)}
.tray::before{display:none}
.box{z-index:1}
.tape{position:relative;width:90%;margin:2px auto 0;padding:20px 18px 18px;filter:drop-shadow(0 0 .5px rgba(27,26,23,.5)) drop-shadow(0 1px 1px rgba(60,35,5,.16)) drop-shadow(0 6px 10px rgba(60,35,5,.12))}
.tape::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#FFFCF5,#FCF5E7);-webkit-mask:var(--zt),var(--zb),linear-gradient(#000 0 0) center/100% calc(100% - 11px) no-repeat;mask:var(--zt),var(--zb),linear-gradient(#000 0 0) center/100% calc(100% - 11px) no-repeat}
.od{padding:14px 0 8px}
.od:first-child{padding-top:6px}
.od+.od{border-top:1px dashed rgba(27,26,23,.45)}
.dh{display:flex;align-items:baseline;gap:8px;padding:0 0 7px;margin-bottom:3px;border-bottom:1px solid rgba(27,26,23,.85);font:500 11px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em}
.dh b{font:600 14px/1.3 var(--sans);color:var(--ink);letter-spacing:.02em}
.dh em{margin-left:auto;font:700 14px/1.3 var(--mono);font-style:normal;color:var(--ink);letter-spacing:0}
.dh em small,.it .am small,.slip .am small{font-size:.72em;font-weight:500;margin-right:1px;color:var(--ink2)}
.it{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0;background:none;border:0;text-align:left;font-family:inherit;color:var(--ink)}
.it .tg{flex:none;min-width:34px;text-align:center;padding:3px 5px 3px;border-radius:3px;background:var(--pc);color:color-mix(in srgb,var(--sc) 62%,#1B1A17);font:600 11px/1.2 var(--sans);letter-spacing:.06em}
.it .nm{flex:0 1 auto;min-width:0;font:500 15px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .kd{flex:none;width:19px;height:19px;margin-left:-3px;background:url(assets/kid.webp) center/contain no-repeat}
.it .ld{flex:1 1 12px;min-width:12px;height:0;border-bottom:1.5px dotted rgba(27,26,23,.28);transform:translateY(4px)}
.it .am{flex:none;font:600 15px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.it:active{opacity:.6}
.row .kid{display:inline-block;width:22px;height:22px;margin:-4px 0 -4px 6px;vertical-align:middle;background:url(assets/kid.webp) center/contain no-repeat;font-size:0;color:transparent}
.tray .empty::before{content:"";width:52px;height:52px;margin-bottom:6px;background:url(assets/coin.webp) center/contain no-repeat}
.tray .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4A3414;font-size:14px;padding:0 20px}
.slip{position:absolute;width:30%;min-height:140px;padding:5px 5px 13px;border:0;background:none;color:var(--ink);text-align:left;display:flex;flex-direction:column;transform:rotate(var(--r,0deg));filter:drop-shadow(0 0 .5px rgba(27,26,23,.6)) drop-shadow(0 1px 1px rgba(60,35,5,.22)) drop-shadow(1px 4px 4px rgba(60,35,5,.2))}
.slip::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#FFFCF5,#FBF4E5);-webkit-mask:var(--zb),linear-gradient(#000 0 0) top/100% calc(100% - 5px) no-repeat;mask:var(--zb),linear-gradient(#000 0 0) top/100% calc(100% - 5px) no-repeat}
.slip:active{transform:rotate(var(--r,0deg)) scale(1.05)}
.slip .art{display:grid;place-items:center;height:48px;border-radius:2px;background:var(--pc,#eee);font-size:36px}
.slip .art .ic{width:36px;height:36px}
.slip .ct{font:600 9px/1.2 var(--sans);letter-spacing:.14em;color:color-mix(in srgb,var(--sc,#777) 62%,#1B1A17);padding:7px 3px 0}
.slip .nm{font-size:13px;line-height:1.25;font-weight:600;padding:2px 3px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.slip .am{margin-top:auto;padding:6px 3px 0;border-top:1px dashed rgba(27,26,23,.3);margin-inline:3px;padding-inline:0;text-align:right;font:700 15px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.slip .nm{margin-bottom:6px}
.slip .bc{display:block;height:7px;margin:6px 3px 0;opacity:.5;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 3px,var(--ink) 3px 5px,transparent 5px 6px,var(--ink) 6px 7px,transparent 7px 10px)}
.stk{position:absolute;right:-6px;top:-7px;width:28px;height:28px;background:url(assets/kid.webp) center/contain no-repeat;font-size:0;color:transparent;transform:rotate(12deg)}
.slip.land{animation:land .55s .75s cubic-bezier(.3,1.3,.5,1) backwards}
@keyframes land{from{transform:translateY(-190px) rotate(calc(var(--r,0deg) - 26deg));opacity:0}}
.card{background:var(--paper);padding:18px;text-align:center}
.empty{color:var(--muted);font-size:14px}

/* statement */
.bill{position:relative;border:solid transparent;border-width:4px 6px 11px 4px;border-image:url(assets/slip.webp) 10 16 30 10/4px 6px 11px 4px round;background:#FCEEDC padding-box;padding:18px 14px 16px;filter:drop-shadow(0 0 .6px rgba(27,26,23,.9)) drop-shadow(1px 3px 2px rgba(60,35,5,.18));display:flex;flex-direction:column;gap:14px;font-family:var(--mono)}
.bill h2{margin:0;font:700 17px/1.3 var(--sans);letter-spacing:.3em;text-align:center}
body.stats .head{display:none}
body.stats .tabs{margin-top:calc(10px + env(safe-area-inset-top,0px))}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-10px}
.mnav .meta{margin-top:0;min-width:128px}
.mv{width:40px;height:40px;border:0;background:none;color:var(--ink);font:700 22px/1 var(--mono);padding:0 0 9px}
.mv:disabled{opacity:.25}
.bill .meta{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--ink2);margin-top:-8px}
.bill hr{border:0;border-top:1.5px dashed var(--ink);margin:0}
.cap{font:500 10px var(--mono);letter-spacing:.14em;color:var(--ink2);display:flex;justify-content:space-between}
.donut{position:relative;width:210px;height:210px;margin:4px auto 2px}
.donut::before,.donut::after{display:none}
.donut .ring{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,#0000 0 63.5%,#000 64.5%);mask:radial-gradient(circle,#0000 0 63.5%,#000 64.5%)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.donut .mid small{font:500 11px var(--sans);color:var(--ink2)}
.donut .mid b{font:700 19px var(--mono)}
.lg .dot{width:10px;height:10px;border-radius:50%;margin:0 2px}
.bill .lg .ico{display:none}
.spent{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.spent small{font:500 11px var(--sans);color:var(--ink2)}
.spent b{font:700 26px/1.2 var(--mono)}
.bill .lg{flex-wrap:wrap;row-gap:7px;padding:11px 0 12px}
.hb{flex:0 0 100%;height:9px;border-radius:2px;background:rgba(27,26,23,.07);overflow:hidden}
.hb i{display:block;height:100%;border-radius:2px}
.seal{flex:none;width:20px;height:20px;margin:0 -3px;display:grid;place-items:center;border:1.4px solid var(--red);border-radius:50%;color:var(--red);font:700 11px/1 var(--sans)}
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:4px 3px}
.waffle i{display:grid;place-items:center;aspect-ratio:1/1.2;background:var(--pc,#eee);color:var(--ink);font-size:15px;padding-bottom:4px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/5px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/5px 100%;outline:1px solid rgba(27,26,23,.25);outline-offset:-1px}
.lg{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 0;text-align:left;font:15px var(--sans);min-height:46px}
.lg:not(:first-child){border-top:1px dotted #B9B4A6}
.lg .n{flex:1;font-weight:600}
.lg .n small{font:500 11px var(--mono);color:var(--muted);margin-left:8px}
.lg .p{width:38px;text-align:right;color:var(--ink2);font:500 12px var(--mono)}
.lg b{font:700 15px var(--mono);min-width:82px;text-align:right}
.lg[aria-expanded="true"] .n{text-decoration:underline;text-underline-offset:4px}
.subs{padding:0 0 8px 24px}
.sr{display:flex;align-items:baseline;gap:8px;padding:5px 0;font:13px var(--sans);color:var(--ink2)}
.sr .n{flex:1;min-width:0;overflow-wrap:anywhere}
.sr small{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.sr .num{font-size:13px}
.sr .p{width:34px;text-align:right;font:500 11px var(--mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#999)}
.sr .dot{align-self:center}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--sans);letter-spacing:.2em}
.sumrow b{font:700 22px var(--mono);letter-spacing:0}
.code{height:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
.bill .thx{text-align:center;font:12px var(--sans);color:var(--ink2);margin-top:-6px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font:600 14px var(--sans);letter-spacing:.14em;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 em{font:500 11px var(--mono);color:var(--muted);font-style:normal;letter-spacing:.04em}
.rolls{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding:10px 6px 0;border-bottom:2px solid var(--ink)}
.roll{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.roll i{display:block;border-radius:50%;background:url(assets/roll.webp) center/contain no-repeat}
.roll[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--desk),0 0 0 5px var(--red)}
.roll span{font:500 11px var(--mono);color:var(--ink2);white-space:nowrap}
.roll[aria-pressed="true"] span{color:var(--ink);font-weight:700}
.rl{display:flex;justify-content:space-between;gap:4px;padding:0 6px}
.rl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.rl .on{color:var(--ink);font-weight:700}
.foot{display:flex;flex-direction:column;align-items:center;padding:14px 0 0;font-size:11px;color:var(--muted);text-align:center;opacity:.85}
.foot-a{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px}
.foot button{background:none;border:0;padding:8px 2px;font-size:11px;color:var(--muted)}
.foot .due{color:var(--red)}

/* jump-to-printer button */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;height:54px;border:0;border-radius:27px;background:var(--dev);color:#F2F0EA;padding:0 20px 0 16px;font:700 15px/1 var(--sans);letter-spacing:.1em;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 #55555b inset,0 12px 22px -10px rgba(0,0,0,.7)}
.fab i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.fab:active{transform:translateY(1px)}

/* sheets are sheets of paper */
.veil{position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;background:var(--paper);width:100%;max-width:460px;border-radius:14px 14px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0;font:700 18px/1.3 var(--sans);letter-spacing:.2em;padding-bottom:12px;border-bottom:1.5px dashed var(--ink)}

<script>
"use strict";
/* ---------- categories ---------- */
const CATS = [
  {id:"market",name:"超市", kw:["超市","stater bro","starter bro","staterbro","stater","斯泰特","买菜","grocer","trader joe","whole foods","safeway","costco","aldi","lidl","kroger","publix","wegmans","sprouts","h mart","hmart","99 ranch","ranch 99","meijer","food lion","giant","stop & shop","albertsons","ralphs","vons","h-e-b","heb","sam\'s club","instacart","奥迪","奥乐齐","阿尔迪","大华","好市多","开市客","全食","缺德舅","walmart","target","沃尔玛","塔吉特","菜市场","杂货","亚洲超市","华人超市","supermarket","market"]},
  {id:"food",   name:"餐饮", kw:["餐饮","早饭","早餐","午饭","午餐","晚饭","晚餐","夜宵","宵夜","吃饭","饭","外卖","奶茶","咖啡","零食","水果","菜","饮料","面包","火锅","烧烤","披萨","汉堡","寿司","面","breakfast","lunch","dinner","brunch","coffee","starbucks","latte","boba","tea","snack","restaurant","doordash","ubereats","uber eats","pizza","burger","sushi","food","meal","chipotle","mcdonald","sam's club"]},
  {id:"transit",name:"交通", kw:["交通","打车","的士","出租","地铁","公交","巴士","火车","高铁","机票","飞机","加油","油费","停车","过路","uber","lyft","taxi","subway","metro","bus","train","flight","gas","parking","toll","bart","caltrain"]},
  {id:"shop",   name:"购物", kw:["购物","衣服","裤子","鞋","包","淘宝","亚马逊","日用","化妆","护肤","洗发","纸巾","电器","手机壳","礼物","玩具","奶粉","尿布","纸尿裤","绘本","文具","toy","diaper","formula","amazon","clothes","shoes","shopping","gift","ikea","sephora"]},
  {id:"home",   name:"居住", kw:["居住","房租","租金","水电","电费","水费","燃气","煤气","网费","宽带","话费","物业","rent","utilit","electric","internet","wifi","phone bill","pg&e"]},
  {id:"fun",    name:"娱乐", kw:["娱乐","电影","游戏","演唱会","ktv","酒吧","旅游","门票","健身","会员","订阅","movie","netflix","spotify","game","concert","bar","gym","ticket","disney","youtube","subscription"]},
  {id:"health", name:"医疗", kw:["医疗","药","医院","看病","挂号","牙","体检","保险","doctor","pharmacy","cvs","walgreens","dentist","medicine","clinic","insurance","copay"]},
  {id:"other",  name:"其他", kw:[]}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const catColor = id => `var(--s-${CAT[id]?id:"other"})`;

/* ---------- parsing ---------- */
const CN_D={"零":0,"〇":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const CN_U={"十":10,"百":100,"千":1000};
function cnInt(s){
  if(s.length>1 && /^[零〇一二两三四五六七八九]+$/.test(s)) return +[...s].map(c=>CN_D[c]).join("");
  let total=0,sec=0,num=0,last=1;
  for(const c of s){
    if(c in CN_D) num=CN_D[c];
    else if(c==="万"){ total+=(sec+num||1)*10000; sec=0; num=0; last=10000; }
    else { sec+=(num||1)*CN_U[c]; num=0; last=CN_U[c]; }
  }
  const short = num && last>=100 && !/[零〇]/.test(s);
  return total+sec+(short? num*last/10 : num);
}
function cnNum(s){

  const rows=CATS.filter(c=>by[c.id]).sort((a,b)=>by[b.id]-by[a.id]);
  const pct=v=>{ const p=v/total*100; return (p<1?"<1":Math.round(p))+"%"; };
  let h='<div class="bill"><h2>月结单</h2><div class="mnav"><button class="mv" type="button" data-month="'+addMonths(S.sel,-1)+'" aria-label="上个月">‹</button><div class="meta">'+monthLabel(S.sel)+' · '+items.length+' 笔</div><button class="mv" type="button" data-month="'+addMonths(S.sel,1)+'" aria-label="下个月"'+(S.sel>=ymOf(ymd(new Date()))?' disabled':'')+'>›</button></div><hr>';
  if(!rows.length) h+='<div class="empty" style="text-align:center;padding:18px 0">哪也没去。这个月还没有小票。</div>';
  else{
    let acc=0; const stops=rows.map(c=>{ const from=acc; acc+=by[c.id]/total*100; const gap=rows.length>1?0.5:0; return catColor(c.id)+' '+(from+gap)+'% '+(acc-gap)+'%, var(--paper) '+(acc-gap)+'% '+(acc+gap)+'%'; }).join(",");
    const top=by[rows[0].id];
    h+='<div class="spent"><small>这个月花掉</small><b>$'+money(total)+'</b><small>'+items.length+' 笔</small></div><hr><div class="legend">';
    for(const c of rows){
      const open=S.open===c.id;
      h+='<button class="lg" type="button" data-open="'+c.id+'" aria-expanded="'+open+'"><span class="tg" style="--pc:'+paper(c.id)+';--sc:'+catColor(c.id)+'">'+c.name+'</span><span class="n"><small>'+cnt[c.id]+' 张</small><small>'+pct(by[c.id])+'</small></span><b>'+money(by[c.id])+'</b><span class="hb" aria-hidden="true"><i style="width:'+Math.max(1.2,by[c.id]/top*100).toFixed(1)+'%;background:'+catColor(c.id)+'"></i></span></button>';
      if(open){
        const g={};
        for(const e of items){ if((CAT[e.c]?e.c:"other")!==c.id) continue; const k=normKey(e.n||""); (g[k]||(g[k]={name:e.n||"（没写备注）",a:0,k:0})); g[k].a+=e.a; g[k].k++; }
        h+='<div class="subs">'+Object.values(g).sort((x,y)=>y.a-x.a).map(x=>{ const q=x.a/by[c.id]*100;
          return '<div class="sr"><span class="n">'+esc(x.name)+(x.k>1?'<small>×'+x.k+'</small>':'')+'</span><span class="p">'+(q<1?"<1":Math.round(q))+'%</span><span class="num">'+money(x.a)+'</span></div>'; }).join("")+'</div>';
      }
    }
    h+='</div><hr><div class="sumrow"><span>合计</span><b>$'+money(total)+'</b></div>';
    const kids=items.filter(e=>e.k), ksum=kids.reduce((s,e)=>s+e.a,0);
    if(kids.length){
      const kopen=S.open==="kid";
      h+='<hr><div class="legend"><button class="lg" type="button" data-open="kid" aria-expanded="'+kopen+'"><span class="seal" aria-hidden="true">孩</span><span class="n">其中 孩子<small>'+kids.length+' 张 · 已含在上面</small></span><span class="p">'+pct(ksum)+'</span><b>'+money(ksum)+'</b></button>';
      if(kopen){
        const g={};
        for(const e of kids){ const cid=CAT[e.c]?e.c:"other", k=cid+"|"+normKey(e.n||""); (g[k]||(g[k]={name:e.n||"（没写备注）",cid,a:0,k:0})); g[k].a+=e.a; g[k].k++; }
        h+='<div class="subs">'+Object.values(g).sort((x,y)=>y.a-x.a).map(x=>'<div class="sr"><span class="n">'+esc(x.name)+'<small>'+CAT[x.cid].name+(x.k>1?' ×'+x.k:'')+'</small></span><span class="num">'+money(x.a)+'</span></div>').join("")+'</div>';
      }
      h+='</div>';
    }
  }
  h+='<div class="code"></div><div class="thx">谢谢惠顾。钱没丢，只是换了个地方住。</div></div>';
  const now=ymOf(ymd(new Date()));
  let end=now; while(addMonths(end,-5)>S.sel) end=addMonths(end,-1);
  const ms=[]; for(let i=5;i>=0;i--) ms.push(addMonths(end,-i));
  const sums=ms.map(sumOf), max=Math.max(1,...sums);
  h+='<div class="sec"><h3>和前几个月比<em>纸卷越大，那个月花得越多</em></h3><div class="rolls">'+ms.map((m,i)=>{ const d=Math.round(sums[i]?24+38*Math.sqrt(sums[i]/max):12);
    return '<button class="roll" type="button" data-month="'+m+'" aria-pressed="'+(m===S.sel)+'" aria-label="'+monthLabel(m)+' $'+money(sums[i])+'"><span>'+(sums[i]?short(sums[i]):"—")+'</span><i style="width:'+d+'px;height:'+d+'px"></i></button>'; }).join("")+
    '</div><div class="rl">'+ms.map(m=>'<span class="'+(m===S.sel?"on":"")+'">'+(+m.slice(5))+'月</span>').join("")+'</div></div>';
  return h;
}
function tab(){ return location.hash==="#stats"?"stats":"list"; }
function renderView(){
  const t=tab();
  $("tab-list").setAttribute("aria-current",t==="list");
  $("tab-stats").setAttribute("aria-current",t==="stats");
  document.body.classList.toggle("stats",t==="stats");
  $("fab").hidden=t!=="stats"&&scrollY<260;
  $("view").innerHTML = t==="stats" ? renderStats() : renderList();
  $("foot").hidden = t!=="stats";
}
function renderPreview(){
  const list=parseInput($("say").value,new Date(),S.learned), today=ymd(new Date());
  $("go").disabled=!list.length;
  $("preview").innerHTML=list.map(e=>'<div class="row">'+rowHTML(e,e.d===today?"":dayLabel(e.d).replace(/ 周.$/,""))+'</div>').join("");
  const typing=$("say").value.trim().length>0;
  $("hint").hidden=typing && list.length>0;
  $("hint").textContent=typing&&!list.length?"多少钱？说个数就行，例如“午饭 12”。":HINT;

}
function renderAll(){ renderHead(); renderView(); renderPreview(); renderBackup(); }

/* ---------- toast ---------- */
let toastTimer=null, undoFn=null;
function toast(text,undo){
  $("toast-t").textContent=text; undoFn=undo||null; $("toast-u").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ $("toast").hidden=true; undoFn=null; },6000);
}
$("toast-u").onclick=()=>{ if(undoFn) undoFn(); undoFn=null; $("toast").hidden=true; };

/* ---------- edit sheet ---------- */
let editing=null;
function openEdit(id){
  const e=Object.values(S.months).map(m=>m.items&&m.items[id]).find(Boolean); if(!e) return;
  editing={id,cat:CAT[e.c]?e.c:"other",kid:!!e.k,orig:{...e}};
  $("e-kid").setAttribute("aria-pressed",editing.kid);
  $("e-amt").value=(e.a/100).toFixed(2); $("e-note").value=e.n||""; $("e-date").value=e.d;
  drawCats(); $("veil").hidden=false;
}
function drawCats(){
  $("e-cats").innerHTML=CATS.map(c=>'<button type="button" class="cat" data-cat="'+c.id+'" aria-pressed="'+(c.id===editing.cat)+'"><span class="ico" style="--pc:'+paper(c.id)+'">'+icon(c.id)+'</span>'+c.name+'</button>').join("");
}
const closeEdit=()=>{ $("veil").hidden=true; editing=null; };
$("e-cats").onclick=ev=>{ const b=ev.target.closest("[data-cat]"); if(b){ editing.cat=b.dataset.cat; drawCats(); } };
$("e-kid").onclick=()=>{ editing.kid=!editing.kid; $("e-kid").setAttribute("aria-pressed",editing.kid); };
$("e-x").onclick=closeEdit;
$("veil").onclick=ev=>{ if(ev.target===$("veil")) closeEdit(); };
$("e-save").onclick=()=>{
  const a=findAmount($("e-amt").value.trim());
  if(!a){ $("e-amt").focus(); toast("金额要填一个大于 0 的数字。"); return; }
  const d=/^\d{4}-\d{2}-\d{2}$/.test($("e-date").value)?$("e-date").value:editing.orig.d;
  const n=$("e-note").value.trim();
  const r=dropItem(editing.id), touched=new Set(r?[r.ym]:[]);
  touched.add(putItem(editing.id,{a:a.cents,n,c:editing.cat,k:editing.kid,d,t:editing.orig.t}));
  touched.forEach(saveMonth);
  let learn=false, note="";
  if(n && editing.cat!==guessCat(n,S.learned)){
    S.learned[normKey(n)]=editing.cat; learn=true;
    const k=applyWord(normKey(n),editing.cat,true);
    note="记住了：以后“"+n+"”都算"+CAT[editing.cat].name+"。"+(k?"之前的 "+k+" 笔也一起改了。":"");
  }
  if(n && editing.kid!==guessKid(n)){ S.learnedKid[normKey(n)]=editing.kid; learn=true; }
  if(learn) saveLearned();
  closeEdit(); renderAll();
  if(note) toast(note);
};
$("e-del").onclick=()=>{
  const id=editing.id, r=dropItem(id); closeEdit();
  if(!r) return; saveMonth(r.ym); renderAll();
  toast("记录删了，钱没回来。",()=>{ saveMonth(putItem(id,r.old)); renderAll(); });
};

/* ---------- events ---------- */
$("say").addEventListener("input",renderPreview);
$("form").addEventListener("submit",ev=>{
  ev.preventDefault();
  const list=parseInput($("say").value,new Date(),S.learned);
  if(!list.length) return;
  $("say").value=""; $("say").blur(); addEntries(list);
});
$("chips").onclick=ev=>{ const b=ev.target.closest(".chip"); if(b){ $("say").value=b.textContent; renderPreview(); $("say").focus(); } };
$("prev").onclick=()=>{ S.sel=addMonths(S.sel,-1); renderAll(); };
$("next").onclick=()=>{ S.sel=addMonths(S.sel,1); renderAll(); };
$("view").onclick=ev=>{
  const row=ev.target.closest("[data-id]");
  if(row){
    if(row.classList.contains("slip")){
      const a=row.getBoundingClientRect(), z=+row.style.zIndex;
      const covered=[...row.parentElement.querySelectorAll(".slip")].some(o=>{ if(o===row||+o.style.zIndex<=z) return false; const b=o.getBoundingClientRect();
        const w=Math.min(a.right,b.right)-Math.max(a.left,b.left), h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top); return w>0&&h>0&&w*h>a.width*a.height*.1; });
      if(covered){ S.zc=(S.zc||500)+1; (S.z||(S.z={}))[row.dataset.id]=S.zc; row.style.zIndex=S.zc; row.classList.remove("land","up"); void row.offsetWidth; row.classList.add("up"); return; }
    }
    return openEdit(row.dataset.id);
  }
  const ob=ev.target.closest("[data-open]"); if(ob){ S.open=S.open===ob.dataset.open?null:ob.dataset.open; renderView();
    const sub=S.open&&document.querySelector(".subs"); if(sub) sub.scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
  const mb=ev.target.closest("[data-month]"); if(mb){ S.sel=mb.dataset.month; renderAll(); return; }
};
$("csv").onclick=()=>{
    const all=Object.keys(S.months).flatMap(itemsOf).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.t||0)-(y.t||0));
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const csv="日期,分类,备注,金额(USD),孩子\n"+all.map(e=>[e.d,(CAT[e.c]||CAT.other).name,q(e.n||""),(e.a/100).toFixed(2),e.k?"是":""].join(",")).join("\n");
    Promise.resolve().then(()=>navigator.clipboard.writeText(csv)).then(()=>toast("已复制 "+all.length+" 条记录。证据确凿。"),()=>toast("这个浏览器不允许复制，请换个浏览器再试。"));
  };

/* ---------- my words ---------- */
function applyWord(k,cat,exact){
  const touched=new Set(); let n=0;
  for(const ym in S.months) for(const e of Object.values(S.months[ym].items||{})){
    const key=normKey(e.n||"");
    if((exact?key===k:key.includes(k)) && e.c!==cat){ e.c=cat; n++; touched.add(ym); }
  }
  touched.forEach(saveMonth); return n;
}
let wCat="market";
function drawWords(){
  $("w-cats").innerHTML=CATS.map(c=>'<button type="button" class="cat" data-cat="'+c.id+'" aria-pressed="'+(c.id===wCat)+'"><span class="ico" style="--pc:'+paper(c.id)+'">'+icon(c.id)+'</span>'+c.name+'</button>').join("");
  const rows=Object.entries(S.learned).filter(([,c])=>CAT[c]).reverse();
  $("w-list").innerHTML=rows.length?rows.map(([w,c])=>'<div class="lg"><span class="dot" style="--c:'+catColor(c)+'"></span><span class="n">'+esc(w)+'</span><span class="c">'+CAT[c].name+'</span><button type="button" data-del="'+esc(w)+'">删除</button></div>').join(""):'<div class="empty">词库还是空的。</div>';
}
$("w-open").onclick=()=>{ drawWords(); $("veil3").hidden=false; };
$("w-x").onclick=()=>{ $("veil3").hidden=true; };
$("veil3").onclick=ev=>{ if(ev.target===$("veil3")) $("veil3").hidden=true; };
$("w-cats").onclick=ev=>{ const b=ev.target.closest("[data-cat]"); if(b){ wCat=b.dataset.cat; drawWords(); } };
$("w-add").onclick=()=>{
  const k=normKey($("w-new").value);
  if(k.length<2){ $("w-new").focus(); toast("词至少要两个字。"); return; }
  S.learned[k]=wCat; saveLearned();
  const n=applyWord(k,wCat,false);
  $("w-new").value=""; drawWords(); renderAll();
  toast("记住了：“"+k+"”算"+CAT[wCat].name+"。"+(n?"之前的 "+n+" 笔也一起改了。":""));
};
$("w-list").onclick=ev=>{ const b=ev.target.closest("[data-del]"); if(!b) return; delete S.learned[b.dataset.del]; saveLearned(); drawWords(); renderPreview(); };

/* ---------- backup ---------- */
const BK="qianne-last-backup";
function renderBackup(){
  let t=null; try{ t=+localStorage.getItem(BK)||null; }catch(e){}
  const n=Object.keys(S.months).reduce((k,ym)=>k+itemsOf(ym).length,0), el=$("bk-age");
  const days=t?Math.floor((Date.now()-t)/864e5):null;
  el.textContent = !n ? "还没有记录，暂时不用备份。" : t===null ? "还没有备份过。" : days===0 ? "上次备份：今天。" : "上次备份："+days+" 天前。";
  el.className = n && (t===null || days>30) ? "due" : "";
}
function exportBackup(){
  const text=JSON.stringify({app:"qianne",v:1,exported:new Date().toISOString(),months:S.months,learned:S.learned,learnedKid:S.learnedKid});
  const name="钱呢-备份-"+ymd(new Date())+".txt";
  const done=msg=>{ try{ localStorage.setItem(BK,String(Date.now())); }catch(e){} renderBackup(); toast(msg); };
  const copy=()=>Promise.resolve().then(()=>navigator.clipboard.writeText(text)).then(()=>done("备份已复制。粘贴到备忘录里存好。"),()=>toast("没能导出，请换个浏览器再试。"));
  if(window.claude) return copy();
  try{
    const file=new File([text],name,{type:"text/plain"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(()=>done("备份已交出去，收好。"),e=>{ if(!e||e.name!=="AbortError") copy(); });
      return;
    }
  }catch(e){}
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"})); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); done("备份文件已下载。");
  }catch(e){ copy(); }
}
function importBackup(text){
  let j=null; try{ j=JSON.parse(text); }catch(e){}
  if(!j || typeof j.months!=="object" || !j.months){ toast("这不是“钱呢？”的备份。"); return false; }
  const have=new Set(Object.keys(S.months).flatMap(ym=>Object.keys(S.months[ym].items||{})));
  const touched=new Set(); let add=0, skip=0;
  for(const ym in j.months) for(const [id0,e] of Object.entries((j.months[ym]||{}).items||{})){
    if(!e || !(e.a>0) || !/^\d{4}-\d{2}-\d{2}$/.test(e.d||"")) continue;
    const id=/^[a-z0-9]+$/i.test(id0)?id0:newId();
    if(have.has(id)){ skip++; continue; }
    touched.add(putItem(id,{a:Math.round(e.a),n:String(e.n||""),c:CAT[e.c]?e.c:"other",k:!!e.k,d:e.d,t:+e.t||Date.now()})); have.add(id); add++;
  }
  let learn=false;
  for(const k in (j.learned||{})) if(!(k in S.learned) && CAT[j.learned[k]]){ S.learned[k]=j.learned[k]; learn=true; }
  for(const k in (j.learnedKid||{})) if(!(k in S.learnedKid) && typeof j.learnedKid[k]==="boolean"){ S.learnedKid[k]=j.learnedKid[k]; learn=true; }
  touched.forEach(saveMonth); if(learn) saveLearned();
  renderAll();
  toast(add ? "导入了 "+add+" 笔"+(skip?"，另有 "+skip+" 笔本来就在。":"。") : skip ? "这些记录本来就都在。" : "备份里没有记录。");
  return true;
}
const closeImp=()=>{ $("veil2").hidden=true; $("imp-text").value=""; };
$("bk-out").onclick=exportBackup;
$("bk-in").onclick=()=>{ $("veil2").hidden=false; };
$("imp-x").onclick=closeImp;
$("veil2").onclick=ev=>{ if(ev.target===$("veil2")) closeImp(); };
$("imp-pick").onclick=()=>$("bk-file").click();
$("bk-file").onchange=ev=>{
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ if(importBackup(String(r.result||""))) closeImp(); }; r.onerror=()=>toast("这个文件读不出来。"); r.readAsText(f); ev.target.value="";
};
$("imp-go").onclick=()=>{ const t=$("imp-text").value.trim(); if(!t){ $("imp-text").focus(); return; } if(importBackup(t)) closeImp(); };
window.addEventListener("hashchange",renderView);
document.addEventListener("keydown",ev=>{ if(ev.key!=="Escape") return; if(!$("veil").hidden) closeEdit(); if(!$("veil2").hidden) closeImp(); $("veil3").hidden=true; });

const SAYINGS=["去去就回","江湖再见","你先动的手","我去帮你换快乐了","富贵在天"]; let sayI=0;
setInterval(()=>{
  const el=$("saying"); el.classList.add("out");
  setTimeout(()=>{ sayI=(sayI+1)%SAYINGS.length; el.textContent=SAYINGS[sayI]; el.classList.remove("out"); },260);
},4200);
/* ---------- entry panel, month swipe ---------- */
$("fab").onclick=()=>{ document.body.classList.remove("stats"); window.scrollTo({top:0,behavior:"smooth"}); if(location.hash==="#stats") location.hash="#list"; $("say").focus({preventScroll:true}); };
addEventListener("scroll",()=>{ $("fab").hidden=tab()!=="stats"&&scrollY<260; },{passive:true});
let sx=null, sy=null;
const headEl=document.getElementById("cardx");
headEl.addEventListener("touchstart",ev=>{ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; },{passive:true});
headEl.addEventListener("touchend",ev=>{
  if(sx===null) return; const t=ev.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
  if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
  if(dx>0) $("prev").click(); else if(!$("next").disabled) $("next").click();
},{passive:true});
renderAll();
initStore();
